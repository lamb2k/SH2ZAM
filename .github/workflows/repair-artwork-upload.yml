name: Restore supplied artwork bytes
on:
  push:
    branches: ['feature/interactive-exhibits-20261113']
    paths: ['.github/workflows/repair-artwork-upload.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact web-sized source asset
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          p=Path('doc/sh2zam-gainz.webp')
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest() == '221c6091317d6a9aacd3d0b03babf3f006ecdfdca74c79a2d9ad2479056c1ca1'
          text=base64.b64encode(b).decode()
          assert text[377:388] == 'AX2nkgC+08k'
          text=text[:377]+text[388:-1]
          fixed=base64.b64decode(text,validate=True)
          assert len(fixed) == 18932
          assert hashlib.sha256(fixed).hexdigest() == 'bb0a8bb2f2520ddcb5baee7c9de7885e70af5d7a472bdabb9d1cb2e8ba677acc'
          p.write_bytes(fixed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/sh2zam-gainz.webp
          git commit -m 'fix: restore supplied GAINZ artwork with verified checksum'
          git push origin HEAD:feature/interactive-exhibits-20261113
