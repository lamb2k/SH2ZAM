name: SH-2 cross compile
on:
  push:
    paths: ['saturn/**', 'CMakeLists.txt', '.github/workflows/sh2-cross.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sh2-objects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull the Yaul project's documented toolchain image
        run: |
          docker pull ijacquez/yaul:latest
          docker image inspect ijacquez/yaul:latest --format '{{index .RepoDigests 0}}' | tee sh2-toolchain-image.txt
      - name: Compile and audit actual big-endian SH-2 objects and link Saturn demo
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work ijacquez/yaul:latest /bin/bash -c '
            set -euo pipefail
            export PATH="$YAUL_INSTALL_ROOT/bin:$PATH"
            CC="${YAUL_ARCH_SH_PREFIX}-gcc"
            AR="${YAUL_ARCH_SH_PREFIX}-ar"
            OBJDUMP="${YAUL_ARCH_SH_PREFIX}-objdump"
            READELF="${YAUL_ARCH_SH_PREFIX}-readelf"
            NM="${YAUL_ARCH_SH_PREFIX}-nm"
            "$CC" --version | tee sh2-compiler.txt
            "$CC" -m2 -mb -ffreestanding -dM -E -x c /dev/null > sh2-macros.txt
            grep -q __SH2__ sh2-macros.txt
            grep -q "__BYTE_ORDER__ __ORDER_BIG_ENDIAN__" sh2-macros.txt
            mkdir -p build/sh2
            for src in saturn/src/*.c; do
              "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror \
                -DSH2Z_REQUIRE_SH2=1 -Isaturn/include -c "$src" \
                -o "build/sh2/$(basename "${src%.c}").o"
            done
            "$AR" rcs build/sh2/libsh2zam.a build/sh2/*.o
            for src in saturn/examples/math_examples.c saturn/examples/saturn_smoke.c; do
              "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror \
                -Isaturn/include -Isaturn/examples -c "$src" \
                -o "build/sh2/$(basename "${src%.c}").o"
            done
            "$READELF" -h build/sh2/libsh2zam.a > sh2-elf.txt
            "$OBJDUMP" -d build/sh2/libsh2zam.a > sh2-disassembly.txt
            "$NM" -u build/sh2/libsh2zam.a > sh2-undefined.txt
            grep -q "big endian" sh2-elf.txt
            grep -q "dmuls.l" sh2-disassembly.txt
            cat sh2-elf.txt
            cat sh2-undefined.txt
            make -C saturn/examples/yaul-smoke
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh2-compile-evidence
          path: |
            build/sh2/
            sh2-*.txt
            saturn/examples/yaul-smoke/*.iso
            saturn/examples/yaul-smoke/*.cue
            saturn/examples/yaul-smoke/*.bin
            saturn/examples/yaul-smoke/build/
