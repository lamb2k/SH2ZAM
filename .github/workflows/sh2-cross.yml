name: SH-2 cross compile
on:
  push:
    paths: ['saturn/**', 'exhibits/bridge.c', 'CMakeLists.txt', '.github/workflows/sh2-cross.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sh2-objects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate shared browser workloads
        run: node saturn/benchmarks/generate-fixtures.cjs
      - name: Pull the Yaul project's documented toolchain image
        run: |
          docker pull ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
          docker image inspect ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 --format '{{index .RepoDigests 0}}' | tee sh2-toolchain-image.txt
      - name: Compile and audit actual big-endian SH-2 objects and link Saturn demo
        shell: bash
        run: |
          set -euo pipefail
          # Docker writes its own build subdirectories as root. Reserve the
          # host interpreter's output directory for the runner before that.
          mkdir -p build/sh2-model
          docker run --rm -e BENCH_COMMIT="$GITHUB_SHA" -v "$PWD:/work" -w /work ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 /bin/bash -c '
            set -euo pipefail
            export PATH="$YAUL_INSTALL_ROOT/bin:$PATH"
            CC="${YAUL_ARCH_SH_PREFIX}-gcc"
            AR="${YAUL_ARCH_SH_PREFIX}-ar"
            OBJDUMP="${YAUL_ARCH_SH_PREFIX}-objdump"
            READELF="${YAUL_ARCH_SH_PREFIX}-readelf"
            NM="${YAUL_ARCH_SH_PREFIX}-nm"
            "$CC" --version | tee sh2-compiler.txt
            "$CC" -m2 -mb -ffreestanding -dM -E -x c /dev/null > sh2-macros.txt
            grep -q __SH2__ sh2-macros.txt
            grep -q "__BYTE_ORDER__ __ORDER_BIG_ENDIAN__" sh2-macros.txt
            mkdir -p build/sh2
            for src in saturn/src/*.c; do
              "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror \
                -DSH2Z_REQUIRE_SH2=1 -Isaturn/include -c "$src" \
                -o "build/sh2/$(basename "${src%.c}").o"
            done
            "$AR" rcs build/sh2/libsh2zam.a build/sh2/*.o
            for src in saturn/examples/math_examples.c saturn/examples/saturn_smoke.c; do
              "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror \
                -Isaturn/include -Isaturn/examples -c "$src" \
                -o "build/sh2/$(basename "${src%.c}").o"
            done
            "$READELF" -h build/sh2/libsh2zam.a > sh2-elf.txt
            "$OBJDUMP" -d build/sh2/libsh2zam.a > sh2-disassembly.txt
            "$NM" -u build/sh2/libsh2zam.a > sh2-undefined.txt
            "$OBJDUMP" -dr build/sh2/sh2zam_transform.o > sh2-batch-disassembly.txt
            "$OBJDUMP" -dr build/sh2/sh2zam_batch_sh2.o > sh2-fused-disassembly.txt
            "$OBJDUMP" -dr build/sh2/sh2zam_prepared.o > sh2-prepared-disassembly.txt
            "$NM" -S --size-sort build/sh2/sh2zam_transform.o > sh2-batch-symbol-sizes.txt
            grep -q "sh2z_mat34_transform_points_general" sh2-batch-symbol-sizes.txt
            grep -q "sh2z_mat34_transform_points" sh2-batch-symbol-sizes.txt
            grep -q "big endian" sh2-elf.txt
            grep -q "dmuls.l" sh2-disassembly.txt
            cat sh2-elf.txt
            cat sh2-undefined.txt
            # Integer-kernel bridge for the executed-instruction model (68000 arithmetic,
            # box overlap, cell placement). Freestanding link against the model RAM map.
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror -DSH2Z_REQUIRE_SH2=1 \
              -Isaturn/include -c saturn/benchmarks/integer-model/bridge.c -o build/sh2/integer-bridge.o
            # The m68k kernels are header-inline: audit the bridge object that instantiates them.
            "$OBJDUMP" -d build/sh2/integer-bridge.o > sh2-m68k-disassembly.txt
            grep -q "div1" sh2-m68k-disassembly.txt
            grep -q "muls.w" sh2-m68k-disassembly.txt
            "$CC" -m2 -mb -nostdlib -nostartfiles -Wl,-T,saturn/benchmarks/integer-model/model.ld -Wl,-e,0 \
              -o build/sh2/integer-model.elf build/sh2/integer-bridge.o build/sh2/libsh2zam.a -lgcc
            # Shade-kernel bridge (shade-1) for the executed-instruction model. The library
            # object must not need memcpy/memset (freestanding and wasm builds have none).
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror -DSH2Z_REQUIRE_SH2=1 \
              -Isaturn/include -c saturn/benchmarks/shade-model/bridge.c -o build/sh2/shade-bridge.o
            "$OBJDUMP" -dr build/sh2/sh2zam_shade.o > sh2-shade-disassembly.txt
            "$NM" -u build/sh2/sh2zam_shade.o | tee sh2-shade-undefined.txt
            if grep -qE "memcpy|memset|memmove" sh2-shade-undefined.txt; then exit 1; fi
            grep -q "dmulu.l" sh2-shade-disassembly.txt
            grep -q "mulu.w" sh2-shade-disassembly.txt
            "$CC" -m2 -mb -nostdlib -nostartfiles -Wl,-T,saturn/benchmarks/integer-model/model.ld -Wl,-e,0 \
              -o build/sh2/shade-model.elf build/sh2/shade-bridge.o build/sh2/libsh2zam.a -lgcc
            # vlc bridge (vlc-1) for the executed-instruction model. The library object
            # must not need memcpy/memset and must contain the hand-written SH-2 decoder.
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror -DSH2Z_REQUIRE_SH2=1 \
              -Isaturn/include -c saturn/benchmarks/vlc-model/bridge.c -o build/sh2/vlc-bridge.o
            "$OBJDUMP" -dr build/sh2/sh2zam_vlc.o > sh2-vlc-disassembly.txt
            "$NM" -u build/sh2/sh2zam_vlc.o | tee sh2-vlc-undefined.txt
            if grep -qE "memcpy|memset|memmove" sh2-vlc-undefined.txt; then exit 1; fi
            grep -q "<_sh2zi_vlc8_run>:" sh2-vlc-disassembly.txt
            grep -q "dmulu.l" sh2-vlc-disassembly.txt
            "$CC" -m2 -mb -nostdlib -nostartfiles -Wl,-T,saturn/benchmarks/integer-model/model.ld -Wl,-e,0 \
              -o build/sh2/vlc-model.elf build/sh2/vlc-bridge.o build/sh2/libsh2zam.a -lgcc
            # Tier merge planner (view-merge-2) for the executed-instruction model. The library
            # object must not need memcpy/memset and must contain the hand-written SH-2 kernel.
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror -DSH2Z_REQUIRE_SH2=1 \
              -Isaturn/include -c saturn/benchmarks/merge-model/bridge.c -o build/sh2/merge-bridge.o
            "$OBJDUMP" -dr build/sh2/sh2zam_view_merge_tier.o > sh2-merge-tier-disassembly.txt
            "$NM" -u build/sh2/sh2zam_view_merge_tier.o | tee sh2-merge-tier-undefined.txt
            if grep -qE "memcpy|memset|memmove" sh2-merge-tier-undefined.txt; then exit 1; fi
            grep -q "<_sh2zi_merge_tier24>:" sh2-merge-tier-disassembly.txt
            "$CC" -m2 -mb -nostdlib -nostartfiles -Wl,-T,saturn/benchmarks/integer-model/model.ld -Wl,-e,0 \
              -o build/sh2/merge-model.elf build/sh2/merge-bridge.o build/sh2/libsh2zam.a -lgcc
            # Fused shade bridge (shade-2) for the executed-instruction model. The library
            # object must need no external symbol and must contain the hand-written kernel.
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror -DSH2Z_REQUIRE_SH2=1 \
              -Isaturn/include -c saturn/benchmarks/shade-fused-model/bridge.c -o build/sh2/shade-fused-bridge.o
            "$OBJDUMP" -dr build/sh2/sh2zam_shade_fused.o > sh2-shade-fused-disassembly.txt
            "$NM" -u build/sh2/sh2zam_shade_fused.o | tee sh2-shade-fused-undefined.txt
            if [ -s sh2-shade-fused-undefined.txt ]; then exit 1; fi
            grep -q "<_sh2z_shade_fog_gouraud>:" sh2-shade-fused-disassembly.txt
            grep -q "dmulu.l" sh2-shade-fused-disassembly.txt
            grep -q "muls.w" sh2-shade-fused-disassembly.txt
            "$CC" -m2 -mb -nostdlib -nostartfiles -Wl,-T,saturn/benchmarks/integer-model/model.ld -Wl,-e,0 \
              -o build/sh2/shade-fused-model.elf build/sh2/shade-fused-bridge.o build/sh2/libsh2zam.a -lgcc
            # unit30 bridge (fixed-unit-1) for the executed-instruction model. The library
            # object must need nothing undefined (no memcpy/memset, no libgcc helper) and
            # must contain the hand-written normalisation; the inline MAC.L dot product
            # is instantiated in the bridge.
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror -DSH2Z_REQUIRE_SH2=1 \
              -Isaturn/include -c saturn/benchmarks/unit30-model/bridge.c -o build/sh2/unit30-bridge.o
            "$OBJDUMP" -dr build/sh2/sh2zam_unit30.o > sh2-unit30-disassembly.txt
            "$OBJDUMP" -dr build/sh2/unit30-bridge.o > sh2-unit30-bridge-disassembly.txt
            "$NM" -u build/sh2/sh2zam_unit30.o | tee sh2-unit30-undefined.txt
            if [ -s sh2-unit30-undefined.txt ]; then exit 1; fi
            grep -q "<_sh2z_vec3_normalize_u30>:" sh2-unit30-disassembly.txt
            grep -q "dmuls.l" sh2-unit30-disassembly.txt
            grep -q "mac.l" sh2-unit30-bridge-disassembly.txt
            "$CC" -m2 -mb -nostdlib -nostartfiles -Wl,-T,saturn/benchmarks/integer-model/model.ld -Wl,-e,0 \
              -o build/sh2/unit30-model.elf build/sh2/unit30-bridge.o build/sh2/libsh2zam.a -lgcc
            make -C saturn/examples/yaul-smoke
            make -C saturn/benchmarks/yaul
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -fno-fast-math -ffp-contract=off -fno-lto -DSH2Z_REQUIRE_SH2=1 -DSH2Z_EXHIBIT_CAPACITY=4096 -Isaturn/include -c exhibits/bridge.c -o build/sh2/benchmark-bridge.o
            "$NM" -u build/sh2/benchmark-bridge.o > sh2-benchmark-float-helpers.txt
            grep -q __mulsf3 sh2-benchmark-float-helpers.txt
            grep -q __addsf3 sh2-benchmark-float-helpers.txt
            sha256sum saturn/benchmarks/yaul/*.iso > sh2-benchmark-image-sha256.txt
            make -C saturn/benchmarks/yaul/calibration
            sha256sum saturn/benchmarks/yaul/calibration/*.iso > sh2-calibration-image-sha256.txt
          '
      - name: Inspect generated batch instructions
        run: python3 saturn/benchmarks/audit-batch.py sh2-batch-disassembly.txt | tee sh2-batch-audit.txt
      - name: Inspect experimental fused instructions
        run: python3 saturn/benchmarks/audit-fused.py sh2-fused-disassembly.txt | tee sh2-fused-audit.txt
      - name: Execute old and optimized math in the SH-2 instruction model
        env:
          MODEL_SUITE: math
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash saturn/benchmarks/sh2-model/run.sh \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.elf \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.sym \
            build/sh2-model/math-results.json
          node saturn/benchmarks/math-model/validate.cjs build/sh2-model/math-results.json
      - name: Execute complete workloads in the SH-2 instruction model
        env:
          MODEL_SUITE: workloads
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash saturn/benchmarks/sh2-model/run.sh \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.elf \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.sym \
            build/sh2-model/workload-results.json
          node saturn/benchmarks/workload-model/validate.cjs build/sh2-model/workload-results.json
      - name: Execute the view batch and divider kernel in the SH-2 instruction model
        env:
          MODEL_SUITE: view
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash saturn/benchmarks/sh2-model/run.sh \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.elf \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.sym \
            build/sh2-model/view-results.json
      - name: Execute compiled SH-2 kernels in the isolated instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash saturn/benchmarks/sh2-model/run.sh \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.elf \
            saturn/benchmarks/yaul/build/sh2zam-benchmark.sym \
            build/sh2-model/results.json
          node saturn/benchmarks/compile-model-results.cjs build/sh2-model/results.json
      - name: Verify and cost the integer kernels in the SH-2 instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_TOOLCHAIN: Yaul project image ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 (sh-elf GCC)
          MODEL_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash saturn/benchmarks/integer-model/run.sh \
            build/sh2/integer-model.elf \
            build/sh2-model/integer-results.json
      - name: Verify and cost the shade kernels in the SH-2 instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_TOOLCHAIN: Yaul project image ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 (sh-elf GCC)
          MODEL_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash saturn/benchmarks/shade-model/run.sh \
            build/sh2/shade-model.elf \
            build/sh2-model/shade-results.json
      - name: Verify and cost the vlc kernels in the SH-2 instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_TOOLCHAIN: Yaul project image ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 (sh-elf GCC)
          MODEL_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash saturn/benchmarks/vlc-model/run.sh \
            build/sh2/vlc-model.elf \
            build/sh2-model/vlc-results.json
      - name: Verify and cost the unit-vector kernels in the SH-2 instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_TOOLCHAIN: Yaul project image ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 (sh-elf GCC)
          MODEL_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash saturn/benchmarks/unit30-model/run.sh \
            build/sh2/unit30-model.elf \
            build/sh2-model/unit30-results.json
      - name: Verify and cost the tier merge planner in the SH-2 instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_TOOLCHAIN: Yaul project image ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 (sh-elf GCC)
          MODEL_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash saturn/benchmarks/merge-model/run.sh \
            build/sh2/merge-model.elf \
            build/sh2-model/merge-results.json
      - name: Verify and cost the fused shade kernel in the SH-2 instruction model
        env:
          MODEL_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_TOOLCHAIN: Yaul project image ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 (sh-elf GCC)
          MODEL_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash saturn/benchmarks/shade-fused-model/run.sh \
            build/sh2/shade-fused-model.elf \
            build/sh2-model/shade-fused-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh2-compile-evidence
          path: |
            build/sh2/
            sh2-*.txt
            saturn/examples/yaul-smoke/*.iso
            saturn/examples/yaul-smoke/*.cue
            saturn/examples/yaul-smoke/*.bin
            saturn/examples/yaul-smoke/build/

            saturn/benchmarks/yaul/*.iso
            saturn/benchmarks/yaul/*.cue
            saturn/benchmarks/yaul/*.bin
            saturn/benchmarks/yaul/build/
            saturn/benchmarks/yaul/calibration/*.iso
            saturn/benchmarks/yaul/calibration/*.cue
            saturn/benchmarks/yaul/calibration/*.bin
            saturn/benchmarks/yaul/calibration/build/*.elf
            saturn/benchmarks/yaul/calibration/build/*.map
            saturn/benchmarks/manifest.json
            build/sh2-model/results.json
            build/sh2-model/raw.json
            build/sh2-model/math-results.json
            build/sh2-model/math-raw.json
            build/sh2-model/workload-results.json
            build/sh2-model/workload-raw.json
            build/sh2-model/view-results.json
            build/sh2-model/view-raw.json
            build/sh2-model/integer-results.json
            build/sh2-model/integer-raw.json
            build/sh2-model/shade-results.json
            build/sh2-model/shade-raw.json
            build/sh2-model/vlc-results.json
            build/sh2-model/vlc-raw.json
            build/sh2-model/merge-results.json
            build/sh2-model/merge-raw.json
            build/sh2-model/shade-fused-results.json
            build/sh2-model/shade-fused-raw.json
            build/sh2-model/unit30-results.json
            build/sh2-model/unit30-raw.json
