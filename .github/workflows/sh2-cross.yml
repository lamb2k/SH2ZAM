name: SH-2 cross compile
on:
  push:
    paths: ['saturn/**', 'exhibits/bridge.c', 'CMakeLists.txt', '.github/workflows/sh2-cross.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sh2-objects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate shared browser workloads
        run: node saturn/benchmarks/generate-fixtures.cjs
      - name: Pull the Yaul project's documented toolchain image
        run: |
          docker pull ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
          docker image inspect ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 --format '{{index .RepoDigests 0}}' | tee sh2-toolchain-image.txt
      - name: Compile and audit actual big-endian SH-2 objects and link Saturn demo
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e BENCH_COMMIT="$GITHUB_SHA" -v "$PWD:/work" -w /work ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 /bin/bash -c '
            set -euo pipefail
            export PATH="$YAUL_INSTALL_ROOT/bin:$PATH"
            CC="${YAUL_ARCH_SH_PREFIX}-gcc"
            AR="${YAUL_ARCH_SH_PREFIX}-ar"
            OBJDUMP="${YAUL_ARCH_SH_PREFIX}-objdump"
            READELF="${YAUL_ARCH_SH_PREFIX}-readelf"
            NM="${YAUL_ARCH_SH_PREFIX}-nm"
            "$CC" --version | tee sh2-compiler.txt
            "$CC" -m2 -mb -ffreestanding -dM -E -x c /dev/null > sh2-macros.txt
            grep -q __SH2__ sh2-macros.txt
            grep -q "__BYTE_ORDER__ __ORDER_BIG_ENDIAN__" sh2-macros.txt
            mkdir -p build/sh2
            for src in saturn/src/*.c; do
              "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror \
                -DSH2Z_REQUIRE_SH2=1 -Isaturn/include -c "$src" \
                -o "build/sh2/$(basename "${src%.c}").o"
            done
            "$AR" rcs build/sh2/libsh2zam.a build/sh2/*.o
            for src in saturn/examples/math_examples.c saturn/examples/saturn_smoke.c; do
              "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -Wall -Wextra -Werror \
                -Isaturn/include -Isaturn/examples -c "$src" \
                -o "build/sh2/$(basename "${src%.c}").o"
            done
            "$READELF" -h build/sh2/libsh2zam.a > sh2-elf.txt
            "$OBJDUMP" -d build/sh2/libsh2zam.a > sh2-disassembly.txt
            "$NM" -u build/sh2/libsh2zam.a > sh2-undefined.txt
            "$OBJDUMP" -dr build/sh2/sh2zam_transform.o > sh2-batch-disassembly.txt
            "$OBJDUMP" -dr build/sh2/sh2zam_batch_sh2.o > sh2-fused-disassembly.txt
            "$OBJDUMP" -dr build/sh2/sh2zam_prepared.o > sh2-prepared-disassembly.txt
            "$NM" -S --size-sort build/sh2/sh2zam_transform.o > sh2-batch-symbol-sizes.txt
            grep -q "sh2z_mat34_transform_points_general" sh2-batch-symbol-sizes.txt
            grep -q "sh2z_mat34_transform_points" sh2-batch-symbol-sizes.txt
            grep -q "big endian" sh2-elf.txt
            grep -q "dmuls.l" sh2-disassembly.txt
            cat sh2-elf.txt
            cat sh2-undefined.txt
            make -C saturn/examples/yaul-smoke
            make -C saturn/benchmarks/yaul
            "$CC" -m2 -mb -O2 -ffreestanding -std=c11 -fno-fast-math -ffp-contract=off -fno-lto -DSH2Z_REQUIRE_SH2=1 -DSH2Z_EXHIBIT_CAPACITY=4096 -Isaturn/include -c exhibits/bridge.c -o build/sh2/benchmark-bridge.o
            "$NM" -u build/sh2/benchmark-bridge.o > sh2-benchmark-float-helpers.txt
            grep -q __mulsf3 sh2-benchmark-float-helpers.txt
            grep -q __addsf3 sh2-benchmark-float-helpers.txt
            sha256sum saturn/benchmarks/yaul/*.iso > sh2-benchmark-image-sha256.txt
          '
      - name: Inspect generated batch instructions
        run: python3 saturn/benchmarks/audit-batch.py sh2-batch-disassembly.txt | tee sh2-batch-audit.txt
      - name: Inspect experimental fused instructions
        run: python3 saturn/benchmarks/audit-fused.py sh2-fused-disassembly.txt | tee sh2-fused-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh2-compile-evidence
          path: |
            build/sh2/
            sh2-*.txt
            saturn/examples/yaul-smoke/*.iso
            saturn/examples/yaul-smoke/*.cue
            saturn/examples/yaul-smoke/*.bin
            saturn/examples/yaul-smoke/build/

            saturn/benchmarks/yaul/*.iso
            saturn/benchmarks/yaul/*.cue
            saturn/benchmarks/yaul/*.bin
            saturn/benchmarks/yaul/build/
            saturn/benchmarks/manifest.json
