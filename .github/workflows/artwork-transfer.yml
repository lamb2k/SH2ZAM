name: Verify artwork transfer
on:
  push:
    branches: ['feature/interactive-exhibits-20261113']
    paths: ['.github/workflows/artwork-transfer.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interactive-exhibits-20261113
      - name: Restore exact supplied artwork preview bytes
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          p=pathlib.Path('doc/sh2zam-gainz.webp')
          data=p.read_bytes()
          expected='bb0a8bb2f2520ddcb5baee7c9de7885e70af5d7a472bdabb9d1cb2e8ba677acc'
          if hashlib.sha256(data).hexdigest()!=expected:
              assert hashlib.sha256(data).hexdigest()=='221c6091317d6a9aacd3d0b03babf3f006ecdfdca74c79a2d9ad2479056c1ca1'
              text=base64.b64encode(data).decode()
              assert text[377:388]=='AX2nkgC+08k'
              text=text[:377]+text[388:-1]
              corrected=base64.b64decode(text,validate=True)
              assert hashlib.sha256(corrected).hexdigest()==expected
              p.write_bytes(corrected)
          print('Verified supplied preview SHA256:',expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/sh2zam-gainz.webp
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve exact GAINZ artwork preview bytes'
            git push origin HEAD:feature/interactive-exhibits-20261113
          fi
